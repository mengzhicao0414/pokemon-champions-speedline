name: Validate new Champions usage source and names
on:
  push:
    branches: [fix/champions-usage-source-20261123]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source API schema and representative usage
        run: |
          python - <<'PY'
          import build_usage
          index=build_usage.get_json("/api")
          print("INDEX",len(index.get("pokemon",[])))
          assert len(index.get("pokemon",[]))>=200
          for fmt in ("Singles","Doubles"):
              ranks=build_usage.get_json("/api/rankings?format="+fmt)
              print("RANKINGS",fmt,len(ranks.get("rankings",[])))
              assert len(ranks.get("rankings",[]))>=200
              for name in ("garchomp","rillaboom","pelipper"):
                  data=build_usage.get_json("/api/battle/"+fmt+"/"+name)
                  rows=build_usage.parse_rows(data)
                  print("SCHEMA",fmt,name,{k:len(v) for k,v in rows.items()},flush=True)
                  print("SAMPLE",fmt,name,{k:len(v) for k,v in rows.items()},rows["moves"][:2])
                  assert all(rows[k] for k in ("moves","items","abilities","spreads","natures"))
          PY
      - name: Full snapshot generation (no commit)
        run: |
          cp usage.json /tmp/previous_usage.json
          python build_usage.py
          python - <<'PY'
          import json
          old=json.load(open("/tmp/previous_usage.json"))
          new=json.load(open("usage.json"))
          for fmt in ("single","double"):
              a=set(old["formats"][fmt]["pokemon"])
              b=set(new["formats"][fmt]["pokemon"])
              print("COMPAT",fmt,"overlap",len(a&b),"old",len(a),"new",len(b),"missing",sorted(a-b)[:30],flush=True)
              assert len(a&b)>=245, "Species keys changed unexpectedly"
              assert len(b)>=250
              for name,details in new["formats"][fmt]["pokemon"].items():
                  assert all(details.get(k) for k in ("moves","items","abilities","spreads","natures")), (fmt,name)
          assert new["names"] == json.load(open("usage_names.json"))
          print("All usage and multilingual name checks passed")
          PY

      - name: Publish verified snapshot to main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python build_usage.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- usage.json; then
            git add usage.json
            git commit -m 'Refresh Champions battle usage from live source'
            git push origin HEAD:main
            curl --fail-with-body --silent --show-error --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
